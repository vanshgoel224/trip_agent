# Builds the native Android app (apps/android: Kotlin + Compose + llama.cpp) as a debug APK.
# Download "biruni-native-apk" from the run's Artifacts. Tags "v*" attach it to the release.
name: Android native app

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-native.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # llama.cpp, pinned in .gitmodules

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: SDK, NDK, CMake
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.31.6" > /dev/null

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: biruni-native-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/app/build/outputs/apk/debug/*.apk
