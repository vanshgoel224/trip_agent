# CI: checks → tests in Docker → runtime image healthy. CD: publish the image to
# GitHub Container Registry (ghcr.io) on main and on version tags (v1.2.3).
#   Local equivalents:  npm run check   ·   docker build --target test .   ·   docker compose up
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Typecheck, syntax-check browser code, secret scan
        run: npm run check

  test-in-docker:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Unit + integration tests (Docker, target=test)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: biruni:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: End-to-end tests (fuzz, remote MCP, drop → SOS) in the test image
        run: docker run --rm -e PROVIDER_MODE=mock -e OFFLINE_MODEL_CONFIG=off biruni:test npm run test:e2e
      - name: Runtime image builds and becomes healthy
        run: |
          docker build -t biruni:latest .
          docker run -d --name biruni -p 8787:8787 -e PROVIDER_MODE=mock biruni:latest
          for i in $(seq 1 30); do s=$(docker inspect --format '{{.State.Health.Status}}' biruni); [ "$s" = healthy ] && break; sleep 2; done
          docker inspect --format '{{.State.Health.Status}}' biruni | grep -q healthy
          curl -fsS http://127.0.0.1:8787/api/lock/status

  publish-image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test-in-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
